<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Academic Calendar Planner</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f4f7fb;
min-height:100vh;
display:flex;
flex-direction:column;
color:#1e293b;
}

header{
background:#0f172a;
color:white;
padding:25px;
text-align:center;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

header h1{
font-size:2rem;
font-weight:600;
}

.container{
width:95%;
max-width:1200px;
margin:30px auto;
}

.form-card{
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
margin-bottom:30px;
}

.form-group{
margin-bottom:18px;
}

label{
display:block;
margin-bottom:8px;
font-weight:500;
}

input,
select,
textarea{
width:100%;
padding:12px 14px;
border:1px solid #d6dce5;
border-radius:10px;
font-size:15px;
}

textarea{
resize:vertical;
min-height:120px;
}

input:focus,
select:focus,
textarea:focus{
outline:none;
border-color:#2563eb;
}

button{
background:#2563eb;
color:white;
border:none;
padding:14px 25px;
border-radius:10px;
cursor:pointer;
font-size:15px;
font-weight:600;
}

button:hover{
background:#1d4ed8;
}

.controls{
display:grid;
grid-template-columns:1fr 300px;
gap:15px;
margin-bottom:25px;
}

.events-section{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.event-card{
padding:18px;
border-left:5px solid #2563eb;
background:#f8fafc;
border-radius:10px;
margin-bottom:15px;
}

.event-date{
font-size:14px;
font-weight:600;
color:#2563eb;
}

.event-dept{
font-weight:600;
margin-top:5px;
}

.event-desc{
margin-top:8px;
line-height:1.6;
}

.pagination{
display:flex;
justify-content:center;
align-items:center;
gap:10px;
margin-top:25px;
flex-wrap:wrap;
}

.pagination button{
padding:8px 14px;
}

.page-info{
font-weight:500;
}

.status{
margin-top:15px;
font-size:14px;
color:green;
}

footer{
margin-top:auto;
background:#0f172a;
color:white;
padding:18px;
text-align:center;
font-size:14px;
}

@media(max-width:768px){

.controls{
grid-template-columns:1fr;
}

header h1{
font-size:1.5rem;
}

}

</style>
</head>
<body>

<header>
<h1>Academic Calendar Planner</h1>
</header>

<div class="container">

<div class="form-card">

<form id="eventForm">

<div class="form-group">
<label>Date</label>
<input type="date" id="date" required>
</div>

<div class="form-group">
<label>Department / Organization</label>

<select id="department" required>

<option value="">Select</option>

<option>Biological Science</option>
<option>Computer Science</option>
<option>Social Science</option>
<option>Journalism</option>
<option>Office</option>
<option>IQAC</option>
<option>NSS</option>
<option>NCC</option>
<option>ASAP</option>
<option>WWS</option>
<option>SSP</option>
<option>Bhoomithra Sena</option>
<option>AICUF</option>
<option>Innovation Club</option>
<option>Literary Club</option>
<option>Media Club</option>
<option>Debate Club</option>
<option>Tourism Club</option>
<option>Music Club</option>
<option>Vimukthi</option>
<option>ED Club</option>
<option>Film Club</option>
<option>Dance Club</option>
<option>History</option>
<option>Women's Cell</option>
<option>YRC</option>
<option>Home Page Committee</option>
<option>College Union</option>
<option>CGPC</option>
<option>NCC (Naval)</option>

</select>
</div>

<div class="form-group">
<label>Activity Details</label>
<textarea id="activity" required></textarea>
</div>

<button type="submit">
Submit Entry
</button>

<div class="status" id="status"></div>

</form>

</div>

<div class="events-section">

<h2 style="margin-bottom:20px;">Submitted Events</h2>

<div class="controls">

<input
type="text"
id="search"
placeholder="Search events..."
>

<select id="deptFilter">
<option value="">All Departments</option>
</select>

</div>

<div id="eventsContainer"></div>

<div class="pagination">

<button id="prevBtn">
Previous
</button>

<div class="page-info" id="pageInfo"></div>

<button id="nextBtn">
Next
</button>

</div>

</div>

</div>

<footer>
Designed and maintained by IT Club, Department of Computer Science
</footer>

<script>

const API_URL =
"https://script.google.com/a/macros/marymathacollege.ac.in/s/AKfycbygWAo5AVCOip8Q-1LbcHHSsFBEnPvAdUZv-iY72FEGvuHryQOII8-CTZJrhIc8M2ryBQ/exec";

let allEvents = [];
let filteredEvents = [];

let currentPage = 1;
const recordsPerPage = 15;

async function loadEvents() {

try {

const response = await fetch(API_URL + "?action=list");

allEvents = await response.json();

allEvents.sort(
(a,b)=>
new Date(a.date) -
new Date(b.date)
);

populateDepartmentFilter();

applyFilters();

}
catch(err){
console.error(err);
}

}

function populateDepartmentFilter(){

const departments =
[
...new Set(
allEvents.map(
e=>e.department
)
)
];

const filter =
document.getElementById("deptFilter");

filter.innerHTML =
'<option value="">All Departments</option>';

departments.forEach(dept=>{

const option =
document.createElement("option");

option.value = dept;
option.textContent = dept;

filter.appendChild(option);

});

}

function applyFilters(){

const search =
document.getElementById("search")
.value
.toLowerCase();

const dept =
document.getElementById("deptFilter")
.value;

filteredEvents =
allEvents.filter(event=>{

const matchesSearch =
event.activity
.toLowerCase()
.includes(search) ||

event.department
.toLowerCase()
.includes(search);

const matchesDept =
dept === "" ||
event.department === dept;

return matchesSearch &&
matchesDept;

});

currentPage = 1;

renderEvents();

}

function renderEvents(){

const container =
document.getElementById("eventsContainer");

container.innerHTML = "";

const start =
(currentPage-1) *
recordsPerPage;

const end =
start +
recordsPerPage;

const pageEvents =
filteredEvents.slice(start,end);

pageEvents.forEach(event=>{

container.innerHTML += `
<div class="event-card">

<div class="event-date">
${formatDate(event.date)}
</div>

<div class="event-dept">
${event.department}
</div>

<div class="event-desc">
${event.activity}
</div>

</div>
`;

});

const totalPages =
Math.ceil(
filteredEvents.length /
recordsPerPage
);

document.getElementById("pageInfo")
.innerHTML =
`Page ${currentPage} of ${totalPages || 1}`;

}

function formatDate(dateString){

const d =
new Date(dateString);

return d.toLocaleDateString(
'en-GB',
{
day:'2-digit',
month:'short',
year:'numeric'
}
);

}

document
.getElementById("search")
.addEventListener(
"input",
applyFilters
);

document
.getElementById("deptFilter")
.addEventListener(
"change",
applyFilters
);

document
.getElementById("prevBtn")
.addEventListener(
"click",
()=>{

if(currentPage>1){

currentPage--;

renderEvents();

}

}
);

document
.getElementById("nextBtn")
.addEventListener(
"click",
()=>{

const totalPages =
Math.ceil(
filteredEvents.length /
recordsPerPage
);

if(currentPage<totalPages){

currentPage++;

renderEvents();

}

}
);

document
.getElementById("eventForm")
.addEventListener(
"submit",
async function(e){

e.preventDefault();

const payload = {

date:
document.getElementById("date").value,

department:
document.getElementById("department").value,

activity:
document.getElementById("activity").value

};

try{

await fetch(API_URL,{

method:"POST",

body:JSON.stringify(payload)

});

document.getElementById("status")
.innerHTML =
"Entry submitted successfully.";

this.reset();

loadEvents();

}
catch(error){

document.getElementById("status")
.innerHTML =
"Submission failed.";

}

}
);

loadEvents();

</script>

</body>
</html>
