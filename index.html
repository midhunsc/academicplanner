<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Academic Calendar Planner</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    flex-direction:column;

    background:
    linear-gradient(
        to bottom,
        #DCEEF8,
        #F5FAFD
    );

    color:#1e293b;
}

/* ======================
   HEADER
====================== */

.college-header{

    background:
    linear-gradient(
        135deg,
        #2E7BA2,
        #4E97BB
    );

    color:white;

    text-align:center;

    padding:30px 20px;

    box-shadow:
    0 4px 15px rgba(0,0,0,.15);
}

.college-logo{

    width:90px;
    height:90px;

    object-fit:contain;

    background:white;

    border-radius:50%;

    padding:8px;

    margin-bottom:15px;

    box-shadow:
    0 4px 12px rgba(0,0,0,.25);
}

.college-header h1{

    font-size:2rem;

    font-weight:700;

    letter-spacing:.5px;
}

.college-header h2{

    margin-top:8px;

    font-size:1.1rem;

    font-weight:400;

    opacity:.95;
}

/* ======================
   MAIN CONTAINER
====================== */

.container{

    width:95%;

    max-width:1200px;

    margin:30px auto;
}

/* ======================
   FORM CARD
====================== */

.form-card{

    background:white;

    padding:35px;

    border-radius:18px;

    border-top:
    5px solid #2E7BA2;

    box-shadow:
    0 10px 30px rgba(46,123,162,.12);

    margin-bottom:30px;
}

.form-card h3{

    color:#2E7BA2;

    margin-bottom:20px;
}

.form-group{

    margin-bottom:18px;
}

label{

    display:block;

    margin-bottom:8px;

    font-weight:600;

    color:#334155;
}

input,
select,
textarea{

    width:100%;

    padding:13px 15px;

    border:
    1px solid #d6dce5;

    border-radius:12px;

    font-size:15px;

    transition:.3s;

    background:white;
}

input:focus,
select:focus,
textarea:focus{

    outline:none;

    border-color:#2E7BA2;

    box-shadow:
    0 0 0 4px rgba(46,123,162,.15);
}

textarea{

    resize:vertical;

    min-height:120px;
}

/* ======================
   BUTTONS
====================== */

button{

    background:#2E7BA2;

    color:white;

    border:none;

    padding:14px 24px;

    border-radius:12px;

    cursor:pointer;

    font-size:15px;

    font-weight:600;

    transition:.3s;
}

button:hover{

    background:#256685;

    transform:translateY(-2px);
}

button:active{

    transform:translateY(0);
}

/* ======================
   STATUS MESSAGE
====================== */

.status{

    margin-top:15px;

    font-weight:500;

    color:#2E7BA2;
}

/* ======================
   EVENTS SECTION
====================== */

.events-section{

    background:white;

    border-radius:18px;

    padding:30px;

    box-shadow:
    0 10px 30px rgba(46,123,162,.12);
}

.section-title{

    color:#2E7BA2;

    font-size:1.5rem;

    font-weight:700;

    margin-bottom:20px;
}

/* ======================
   SEARCH & FILTER
====================== */

.controls{

    display:grid;

    grid-template-columns:
    1fr 300px;

    gap:15px;

    margin-bottom:25px;
}

/* ======================
   EVENT CARDS
====================== */

.event-card{

    background:white;

    border-left:
    6px solid #2E7BA2;

    border-radius:12px;

    padding:18px;

    margin-bottom:15px;

    box-shadow:
    0 3px 12px rgba(0,0,0,.06);

    transition:.3s;
}

.event-card:hover{

    transform:translateY(-2px);

    box-shadow:
    0 8px 20px rgba(0,0,0,.08);
}

.event-date{

    color:#2E7BA2;

    font-weight:700;

    font-size:14px;
}

.event-dept{

    margin-top:8px;

    font-weight:700;

    font-size:16px;

    color:#1e293b;
}

.event-desc{

    margin-top:10px;

    color:#475569;

    line-height:1.7;
}

/* ======================
   PAGINATION
====================== */

.pagination{

    margin-top:30px;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:12px;

    flex-wrap:wrap;
}

.page-info{

    font-weight:600;

    color:#2E7BA2;
}

/* ======================
   FOOTER
====================== */

footer{

    margin-top:auto;

    background:#2E7BA2;

    color:white;

    text-align:center;

    padding:20px;

    font-size:14px;

    box-shadow:
    0 -2px 10px rgba(0,0,0,.08);
}

footer strong{

    font-weight:600;
}

/* ======================
   SCROLLBAR
====================== */

::-webkit-scrollbar{
    width:10px;
}

::-webkit-scrollbar-track{
    background:#e8f3f9;
}

::-webkit-scrollbar-thumb{
    background:#2E7BA2;
    border-radius:10px;
}

::-webkit-scrollbar-thumb:hover{
    background:#256685;
}

/* ======================
   MOBILE
====================== */

@media(max-width:768px){

    .college-header h1{

        font-size:1.5rem;
    }

    .college-header h2{

        font-size:1rem;
    }

    .controls{

        grid-template-columns:1fr;
    }

    .form-card{

        padding:25px;
    }

    .events-section{

        padding:20px;
    }

    .college-logo{

        width:75px;
        height:75px;
    }
}

</style>
</head>
<body>

<header class="college-header">

    <img
        src="collegelogo.png"
        alt="College Logo"
        class="college-logo">

    <h1>Mary Matha Arts & Science College</h1>

    <h2>Academic Calendar Planner</h2>

</header>

<div class="container">

<div class="form-card">

<form id="eventForm">

<div class="form-group">
<label>Date</label>
<input type="text" id="date" required>
</div>

<div class="form-group">
<label>Department /Cells/Clubs/Organizations</label>

<select id="department" required>

    <option value="">Select Department / Organization</option>

    <optgroup label="Departments">
        <option>Biological Techniques</option>
        <option>Chemistry</option>
        <option>Commerce</option>
        <option>Computer Science</option>
        <option>English</option>
        <option>Hindi</option>
        <option>History</option>
        <option>Journalism</option>
        <option>Malayalam</option>
        <option>Mathematics</option>
        <option>Physical Education</option>
        <option>Physics</option>
        <option>Political Science</option>
        <option>Social Science-Economics</option>
        <option>Statistics</option>
        <option>Zoology</option>
    </optgroup>

    <optgroup label="Cells, Clubs & Organizations">
        <option>AICUF</option>
        <option>ASAP</option>
        <option>Bhoomithrasena</option>
        <option>CGPC</option>
        <option>College Union</option>
        <option>Dance Club</option>
        <option>Debate Club</option>
        <option>ED Club</option>
        <option>Film Club</option>
        <option>Innovation and Incubation Club</option>
        <option>IIC</option>
        <option>IQAC</option>
        <option>IT Club</option>
        <option>Library</option>
        <option>Literary Club</option>
        <option>Media Club</option>
        <option>Music Club</option>
        <option>NCC (Army)</option>
        <option>NCC (Naval)</option>
        <option>NSS</option>
        <option>Office</option>
        <option>Scholarship</option>
        <option>Tourism Club</option>
        <option>Vimukthi Club</option>
        <option>Women's Cell</option>
        <option>WWS</option>
        <option>YRC</option>
    </optgroup>

</select>
</div>

<div class="form-group">
<label>Activity Details</label>
<textarea id="activity" required></textarea>
</div>

<button type="submit">
Submit Entry
</button>

<div class="status" id="status"></div>

</form>

</div>

<div class="events-section">

<h2 style="margin-bottom:20px;">Submitted Events</h2>

<div class="controls">

<input
type="text"
id="search"
placeholder="Search events..."
>

<select id="deptFilter">
<option value="">All Departments</option>
</select>

</div>

<div id="eventsContainer"></div>

<div class="pagination">

<button id="prevBtn">
Previous
</button>

<div class="page-info" id="pageInfo"></div>

<button id="nextBtn">
Next
</button>

</div>

</div>

</div>

<footer>
Designed and maintained by IT Club, Department of Computer Science
</footer>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbygWAo5AVCOip8Q-1LbcHHSsFBEnPvAdUZv-iY72FEGvuHryQOII8-CTZJrhIc8M2ryBQ/exec";

let allEvents = [];
let filteredEvents = [];

let currentPage = 1;
const recordsPerPage = 15;

async function loadEvents() {

try {

const response = await fetch(API_URL + "?action=list");

allEvents = await response.json();

allEvents.sort(
(a,b)=>
new Date(a.date) -
new Date(b.date)
);

populateDepartmentFilter();

applyFilters();

}
catch(err){
console.error(err);
}

}

function populateDepartmentFilter(){

const departments =
[
...new Set(
allEvents.map(
e=>e.department
)
)
];

const filter =
document.getElementById("deptFilter");

filter.innerHTML =
'<option value="">All Departments</option>';

departments.forEach(dept=>{

const option =
document.createElement("option");

option.value = dept;
option.textContent = dept;

filter.appendChild(option);

});

}

function applyFilters(){

const search =
document.getElementById("search")
.value
.toLowerCase();

const dept =
document.getElementById("deptFilter")
.value;

filteredEvents =
allEvents.filter(event=>{

const matchesSearch =
event.activity
.toLowerCase()
.includes(search) ||

event.department
.toLowerCase()
.includes(search);

const matchesDept =
dept === "" ||
event.department === dept;

return matchesSearch &&
matchesDept;

});

currentPage = 1;

renderEvents();

}

function renderEvents(){

const container =
document.getElementById("eventsContainer");

container.innerHTML = "";

const start =
(currentPage-1) *
recordsPerPage;

const end =
start +
recordsPerPage;

const pageEvents =
filteredEvents.slice(start,end);

pageEvents.forEach(event=>{

container.innerHTML += `
<div class="event-card">

<div class="event-date">
${formatDate(event.date)}
</div>

<div class="event-dept">
${event.department}
</div>

<div class="event-desc">
${event.activity}
</div>

</div>
`;

});

const totalPages =
Math.ceil(
filteredEvents.length /
recordsPerPage
);

document.getElementById("pageInfo")
.innerHTML =
`Page ${currentPage} of ${totalPages || 1}`;

}

function formatDate(dateString){

const d =
new Date(dateString);

return d.toLocaleDateString(
'en-GB',
{
day:'2-digit',
month:'short',
year:'numeric'
}
);

}

document
.getElementById("search")
.addEventListener(
"input",
applyFilters
);

document
.getElementById("deptFilter")
.addEventListener(
"change",
applyFilters
);

document
.getElementById("prevBtn")
.addEventListener(
"click",
()=>{

if(currentPage>1){

currentPage--;

renderEvents();

}

}
);

document
.getElementById("nextBtn")
.addEventListener(
"click",
()=>{

const totalPages =
Math.ceil(
filteredEvents.length /
recordsPerPage
);

if(currentPage<totalPages){

currentPage++;

renderEvents();

}

}
);

document
.getElementById("eventForm")
.addEventListener(
"submit",
async function(e){

e.preventDefault();

const payload = {

date:
document.getElementById("date").value,

department:
document.getElementById("department").value,

activity:
document.getElementById("activity").value

};

try{

await fetch(API_URL,{

method:"POST",

body:JSON.stringify(payload)

});

document.getElementById("status")
.innerHTML =
"Entry submitted successfully.";

this.reset();

loadEvents();

}
catch(error){

document.getElementById("status")
.innerHTML =
"Submission failed.";

}

}
);

loadEvents();

</script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<script>
flatpickr("#date", {
    dateFormat: "d-m-Y",
    allowInput: true
});
</script>
</body>
</html>
